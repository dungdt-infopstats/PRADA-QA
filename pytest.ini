[tool:pytest]
# Pytest configuration for MASEE

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings

# Markers for different test types
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
    slow: Slow tests that take significant time
    requires_api: Tests that require API keys
    requires_network: Tests that require network access

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:helium.*
    ignore::UserWarning:selenium.*

# Coverage settings (if pytest-cov is installed)
[coverage:run]
source = src
omit =
    */tests/*
    */test_*
    */conftest.py
    */__pycache__/*
    */.*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod